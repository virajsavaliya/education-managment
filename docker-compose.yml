version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eduna-db
    restart: always
    environment:
      POSTGRES_USER: eduna
      POSTGRES_PASSWORD: edunapassword
      POSTGRES_DB: edunadb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduna -d edunadb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: eduna-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://eduna:edunapassword@db:5432/edunadb?schema=public"
      JWT_SECRET: "eduna_secret_jwt_sign_key_change_me_in_production_12345"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: ["sh", "-c", "npx prisma db push && npx prisma db seed && npx next build && npx next start -H 0.0.0.0"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
